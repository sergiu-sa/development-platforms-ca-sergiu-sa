<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- In production this document is generated by the server, which replaces this title and adds the briefing's own Open Graph tags.
     This copy is what Vite builds the entry from and what `npm run dev` serves. -->
    <title>Lede - Briefing</title>
  </head>
  <body>
    <!-- Deliberately empty.
     The page's whole frame is built by web/src/briefing/view.ts, because the server has to emit the same document and a frame written here as well would be the same markup in two places. -->
    <div id="root">
      <p class="m quiet">Loading this briefing...</p>
    </div>

    <noscript>
      <p class="m">
        This briefing needs JavaScript to read.
        <a href="/index.html">Go to the wire</a>
      </p>
    </noscript>

    <script type="module" src="/src/pages/briefing.ts"></script>
  </body>
</html>
