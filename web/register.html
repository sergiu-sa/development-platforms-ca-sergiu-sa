<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Lede</title>
  </head>
  <body class="min-h-screen">
    <nav class="border-b border-rule">
      <div class="page-shell py-4 flex justify-between items-center">
        <a href="/index.html" class="word">Lede<b>.</b></a>
        <div class="m flex items-center gap-4">
          <a href="/index.html" class="nav-link">Home</a>
          <a href="/login.html" id="nav-login" class="nav-link">Login</a>
          <a href="/register.html" id="nav-register" class="nav-link"
            >Register</a
          >
          <span id="nav-user-email" class="quiet" hidden></span>
          <button id="nav-logout" class="nav-link" hidden>Logout</button>
        </div>
      </div>
    </nav>

    <main class="auth-page">
      <h1 class="auth-h">Create account</h1>

      <form id="register-form" class="auth-form">
        <div>
          <label for="email" class="auth-label m quiet">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            class="auth-input"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label for="username" class="auth-label m quiet">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            minlength="3"
            maxlength="30"
            pattern="[a-zA-Z0-9_-]+"
            autocomplete="username"
            class="auth-input"
            placeholder="How you'll appear on articles"
          />
          <p class="auth-hint">
            Letters, numbers, hyphens and underscores. Shown publicly instead of
            your email.
          </p>
        </div>

        <div>
          <label for="password" class="auth-label m quiet">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="6"
            autocomplete="new-password"
            class="auth-input"
            placeholder="At least 6 characters"
          />
        </div>

        <div>
          <label for="confirm-password" class="auth-label m quiet"
            >Confirm password</label
          >
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            required
            minlength="6"
            autocomplete="new-password"
            class="auth-input"
            placeholder="Confirm your password"
          />
        </div>

        <p id="error-message" class="auth-error hidden" role="alert"></p>
        <p id="success-message" class="auth-success hidden"></p>

        <button type="submit" class="btn btn-blue m self-start mt-2">
          Create account
        </button>
      </form>

      <p class="auth-foot">
        Already have an account?
        <a href="/login.html" class="nav-link">Login</a>
      </p>
    </main>

    <script type="module" src="/src/pages/register.ts"></script>
  </body>
</html>
