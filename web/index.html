<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lede - The Wire</title>
  </head>
  <body class="min-h-screen bg-paper text-ink">
    <!-- Navigation -->
    <nav class="border-b border-ink/10">
      <div
        class="max-w-3xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <a href="/index.html" class="font-bold tracking-tight">Lede</a>
        <div class="flex items-center gap-4 text-sm">
          <a href="/index.html" class="nav-link">Home</a>
          <a href="/login.html" id="nav-login" class="nav-link">Login</a>
          <a href="/register.html" id="nav-register" class="nav-link"
            >Register</a
          >
          <span
            id="nav-user-email"
            class="text-ink/72"
            style="display: none"
          ></span>
          <button id="nav-logout" class="nav-link" style="display: none">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- The wire: a continuous typographic decay field, not a list of
         cards. The newest story is huge; each story down the page is
         smaller, narrower and lighter. Scrolling down is scrolling
         backwards through the day. -->
    <div class="wire-page">
      <aside id="wire-rail" class="wire-rail" aria-hidden="true"></aside>
      <main id="wire-container" class="wire-main">
        <p class="text-sm text-ink/72">Loading the wire...</p>
      </main>
    </div>

    <script type="module" src="/src/pages/wire.ts"></script>
  </body>
</html>
