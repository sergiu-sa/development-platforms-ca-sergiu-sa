<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lede - The Wire</title>
  </head>
  <body>
    <!-- One stable h1 for the whole page. The card's headline is an h2:
      it changes on every keypress, and a heading that moves under a screen reader is worse than one that is never seen. -->
    <h1 class="sr-only">The wire</h1>

    <section class="deck">
      <!-- The rails are a visual record of the session.
       Decorative: every decision they show is announced by the live region below, so reading  out a column of slugs would only repeat it. -->
      <aside class="rail rail-skip" aria-hidden="true">
        <span class="rail-name m">Skipped</span>
        <span class="rail-n" id="rail-skip-n">0</span>
        <div class="spindle" id="rail-skip-slugs"></div>
      </aside>

      <div class="stage">
        <header class="top">
          <a href="/index.html" class="word">Lede<b>.</b></a>
          <p class="top-mid m quiet" id="dateline"></p>
          <p class="gauge m">
            <span id="deck-position"></span>
            <span class="gauge-bar" id="gauge-bar" aria-hidden="true"></span>
          </p>
          <nav class="top-nav m" aria-label="Account">
            <a href="/login.html" id="nav-login" class="nav-link">Log in</a>
            <a
              id="nav-user"
              class="nav-link top-nav-user"
              href="/index.html"
              hidden
            ></a>
            <button id="nav-logout" class="nav-link" type="button" hidden>
              Log out
            </button>
          </nav>
        </header>

        <div class="card-wrap" id="deck-slot">
          <div class="deck-panel">
            <p class="deck-panel-line">Loading the wire...</p>
          </div>
        </div>

        <!-- A fixed-height row, so the labels shorten rather than wrap.
         Both lengths are aria-hidden and the button carries one constant label, so a screen reader hears "Skip this story" at every width instead of hearing it twice at one width. -->
        <div class="acts" id="deck-acts" hidden>
          <button
            class="act act-skip"
            id="deck-skip"
            type="button"
            aria-label="Skip this story (keyboard shortcut X)"
          >
            <span class="key m" aria-hidden="true">X</span>
            <span class="m long" aria-hidden="true">Skip this story</span>
            <span class="m short" aria-hidden="true">Skip</span>
          </button>
          <!-- The count is pulled out of the two shortening labels so it exists once, rather than being written into both. -->
          <a class="act act-browse m" href="#browse" id="deck-browse">
            <span class="long" aria-hidden="true">Browse all</span>
            <span class="short" aria-hidden="true">All</span>
            <span aria-hidden="true"
              ><span id="browse-count">0</span> &darr;</span
            >
          </a>
          <button
            class="act act-save"
            id="deck-save"
            type="button"
            aria-label="Save to my desk (keyboard shortcut S)"
          >
            <span class="m long" aria-hidden="true">Save to my desk</span>
            <span class="m short" aria-hidden="true">Save</span>
            <span class="key m" aria-hidden="true">S</span>
          </button>
        </div>
      </div>

      <aside class="rail rail-save" aria-hidden="true">
        <span class="rail-name m">Saved</span>
        <span class="rail-n" id="rail-save-n">0</span>
        <div class="spindle" id="rail-save-slugs"></div>
      </aside>
    </section>

    <!-- Sits here rather than at the end of the body so a keyboard walk reaches Undo straight after the decision that offered it. -->
    <div class="toast" id="deck-toast" hidden>
      <span class="m" id="toast-text" aria-hidden="true"></span>
      <button class="m toast-undo" id="deck-undo" type="button">
        <span aria-hidden="true">Undo</span>
        <span class="key m" aria-hidden="true">Z</span>
      </button>
    </div>

    <!-- The live region. Always in the document and never display: none, which is what makes a screen reader announce a change to it.
     The toast above is aria-hidden apart from its button, so each decision is announced exactly once. -->
    <p class="sr-only" id="deck-announcer" role="status"></p>

    <main>
      <!-- Sticky, and sitting directly after a 100dvh deck, so it takes over exactly when the deck stops being visible.
       Nothing has to watch the scroll position for that to be true. -->
      <header class="spine" id="spine">
        <a href="/index.html" class="word">Lede<b>.</b></a>
        <span class="m quiet" id="spine-count"></span>
        <!-- Public, so unlike the desk it is shown to everybody.
           Briefings are the thing this product is for and they had no way in at all until now. -->
        <a class="btn m" href="/briefings.html">Briefings</a>
        <!-- Shown to a signed-in reader only:
         a signed-out one has no desk to go to, and the tray offers them the sign-in that would give them
             one. -->
        <a class="btn m" id="spine-desk" href="/desk.html" hidden>My desk</a>
        <button class="btn m" id="spine-deck" type="button"></button>
      </header>

      <!-- A stale wire is a timestamp, never an alarm. Old news reads fine. -->
      <div class="stale m" id="wire-stale" hidden></div>

      <div class="sec-head" id="browse">
        <h2 class="sec-title">Everything on the wire</h2>
        <p class="note quiet">
          Read in any order. Save what you want to come back to.
        </p>
      </div>

      <div class="controls" id="browse-controls"></div>

      <div id="wire-container">
        <p class="m quiet wire-loading">Loading the wire...</p>
      </div>
    </main>

    <footer class="foot m quiet">
      <span>Lede</span>
      <span>Stories &copy; Guardian News &amp; Media</span>
      <span aria-hidden="true">-30-</span>
    </footer>

    <!-- The running record of the session. Hidden until something is saved, so it never occupies the bottom of an untouched page. -->
    <div class="tray" id="tray" hidden>
      <span class="tray-n m"><b id="tray-n">0</b> on your desk</span>
      <div class="tray-chips" id="tray-chips"></div>
      <div id="tray-cta"></div>
    </div>

    <script type="module" src="/src/pages/wire.ts"></script>
  </body>
</html>
