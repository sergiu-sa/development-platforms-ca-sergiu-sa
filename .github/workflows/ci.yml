name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: news_api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite reads .env.test. These are throwaway CI credentials for the
      # service container above, so there is nothing here worth a secret.
      - name: Write test environment
        run: |
          cat > .env.test <<'EOF'
          MYSQLHOST=127.0.0.1
          MYSQLPORT=3306
          MYSQLUSER=root
          MYSQLPASSWORD=ci_root_password
          MYSQLDATABASE=news_api_test
          JWT_SECRET=ci_secret_not_used_anywhere_real
          EOF

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
